name: perturb check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # stale detection reads each plan's last commit time from git log
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: perturb check
        # the sync calls gh (PERTURB_GH unset), which authenticates with the workflow token
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run perturb check
