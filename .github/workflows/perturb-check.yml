name: perturb check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # stale detection reads each plan's last commit time from git log
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: perturb check
        # the sync calls gh (PERTURB_GH unset), which authenticates with the workflow token
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run perturb check
