name: CI

on:
  push:
    branches: [main]
  pull_request:
    # A PR that only adds plans or ledger events changes nothing these jobs test.
    # perturb-check.yml still runs on it, since plans and events are what it checks.
    # tasks/README.md is re-included because the link check covers it.
    paths:
      - "**"
      - "!tasks/**"
      - "!perturb/events/**"
      - "tasks/README.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Oldest supported and newest: breakage in the middle with both
        # endpoints green is rare enough that the middle rungs don't pay
        # for their CI minutes.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure git identity for tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Run tests
        run: uv run pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Ruff check
        run: uv run ruff check src tests scripts
      - name: Ruff format
        run: uv run ruff format --check src tests scripts
      - name: Documentation links
        run: uv run python scripts/check_doc_links.py
      - name: Plugin manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null

  workflows:
    name: Audit workflows (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Zizmor
        # The token turns on the online audits, impostor-commit in particular,
        # which is what makes the hash pins above worth anything.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run zizmor --format plain .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/perturb --version
          /tmp/smoke/bin/perturb --help
